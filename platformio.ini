; ============================================================================
;  Tamagoxi v2 - Tamagotchi gegant per a la Noa
;  Plataforma: ESP32-WROOM-32E (LCDWiki E32R40T / ESP32-32E) + ST7796S 320x480
;  Compilar i pujar:  pio run -t upload      Monitor:  pio device monitor
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 4 MB de flash, particio d'aplicacio gran i sense OTA (no la necessitem).
board_build.partitions = huge_app.csv

; El pont USB-serie es un CH340: 460800 va be.
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    ; Imprescindible: TFT_eSPI viu a .pio/libdeps i tambe ha de trobar
    ; include/tft_setup.h (el carrega ell sol via __has_include(<tft_setup.h>)).
    -I include
    ; Fase 7: el buffer de l'A2DP per defecte (512x30 = 15 kB) es queda gran
    ; per aquest xip: amb 512x6 n'hi ha prou i estalviem memoria.
    -D A2DP_BUFFER_SIZE=512
    -D A2DP_BUFFER_COUNT=6

lib_deps =
    ; Mateixa versio que la validada a la placa al projecte v1 (Tamagoxi).
    TFT_eSPI@2.5.43
    ; JSON per llegir els manifest.json dels actius de la SD (/pets, /backgrounds).
    ArduinoJson@^7.0.0
    ; Fase 7 (so): decodificador MP3/WAV, sortida al DAC intern de l'ESP32 i
    ; emissor Bluetooth A2DP. Sempre amb l'ultima revisio del repositori.
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/ESP32-A2DP.git
    https://github.com/pschatzmann/arduino-libhelix.git
    ; S'afegira mes endavant:
    ;   lvgl@8.3.11          (Fase 4: UI - HUD, barres, botons)

