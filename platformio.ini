; ============================================================================
;  Tamagoxi v2 - Tamagotchi gegant per a la Noa
;  Plataforma: ESP32-WROOM-32E (LCDWiki E32R40T / ESP32-32E) + ST7796S 320x480
;  Compilar i pujar:  pio run -t upload      Monitor:  pio device monitor
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Aquesta placa (la pantalla) va pel CH340.
upload_port = /dev/cu.wchusbserial1410

; 4 MB de flash, particio d'aplicacio gran i sense OTA (no la necessitem).
board_build.partitions = huge_app.csv

; El firmware del xip amic viu al mateix src/ pero no es compila aqui.
build_src_filter = +<*> -<friend_main.cpp>

; El pont USB-serie es un CH340: 460800 va be.
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    ; Imprescindible: TFT_eSPI viu a .pio/libdeps i tambe ha de trobar
    ; include/tft_setup.h (el carrega ell sol via __has_include(<tft_setup.h>)).
    -I include
    ; Fase 7: el buffer de l'A2DP per defecte (512x30 = 15 kB) es queda gran
    ; per aquest xip: amb 512x6 n'hi ha prou i estalviem memoria.
    -D A2DP_BUFFER_SIZE=512
    -D A2DP_BUFFER_COUNT=6

lib_deps =
    ; Mateixa versio que la validada a la placa al projecte v1 (Tamagoxi).
    TFT_eSPI@2.5.43
    ; JSON per llegir els manifest.json dels actius de la SD (/pets, /backgrounds).
    ArduinoJson@^7.0.0
    ; Fase 7 (so): decodificador MP3/WAV, sortida al DAC intern de l'ESP32 i
    ; emissor Bluetooth A2DP. Sempre amb l'ultima revisio del repositori.
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/ESP32-A2DP.git
    https://github.com/pschatzmann/arduino-libhelix.git
    ; S'afegira mes endavant:
    ;   lvgl@8.3.11          (Fase 4: UI - HUD, barres, botons)

; ============================================================================
;  Firmware de PROVES DE GRAFICS
;  Nomes SD + pantalla + tactil: res de so, xarxa ni mascota.
;  Es petit i es carrega rapid. Serveix per revisar fons i animacions.
;
;    pio run -e test -t upload        (ATENCIO: sobreescriu el firmware normal)
;    pio run -e esp32dev -t upload    (per tornar-hi)
; ============================================================================
[env:test]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
upload_port = /dev/cu.wchusbserial1410
upload_speed = 460800
monitor_speed = 115200
build_flags =
    -I include
build_src_filter =
    +<test_main.cpp>
    +<sd_assets.cpp>
    +<bg_renderer.cpp>
    +<display.cpp>
    +<touch.cpp>
    +<led.cpp>
lib_deps =
    TFT_eSPI@2.5.43
    ArduinoJson@^7.0.0

; ============================================================================
;  Xip amic: la segona placa (ESP32 DevKit v4) que fa de periferics
;  (Bluetooth i audio). Parla amb la pantalla per un UART de 3 fils.
;
;    pio run -e friend -t upload        (puja el firmware de l'amic)
;    pio device monitor -e friend       (mira que diu)
; ============================================================================
[env:friend]
platform = espressif32
board = esp32dev
framework = arduino
; Dues particions d'aplicacio (app0/app1) per poder-hi carregar per OTA.
; El firmware de l'amic hi ha de capiguer: 1,875 MB per lloc.
board_build.partitions = min_spiffs.csv

; Aquesta placa va pel CP2102 (port diferent de la pantalla).
upload_port = /dev/cu.usbserial-0001
upload_speed = 460800
monitor_speed = 115200

; D'aquest projecte nomes es compila el firmware del xip amic.
build_src_filter = -<*> +<friend_main.cpp>
build_flags =
    -I include
    ; Mateixos parametres d'A2DP que la pantalla: el buffer gran no hi cap.
    -D A2DP_BUFFER_SIZE=512
    -D A2DP_BUFFER_COUNT=6

; Les mateixes llibreries de so que la pantalla (aqui hi anira el Bluetooth i
; la descodificacio, aixi la pantalla queda lliure i pot fer OTA).
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/ESP32-A2DP.git
    https://github.com/pschatzmann/arduino-libhelix.git

